.wave .legL{animation:w-legL 2s ease-in-out 2 both}
@keyframes w-legL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-5deg)}}
.wave .legR{animation:w-legR 2s ease-in-out 2 both}
@keyframes w-legR{0%,100%{transform:rotate(4deg)}50%{transform:rotate(0deg)}}
.wave .mouth{animation:w-mouth 4s ease-in-out 2 both}
@keyframes w-mouth{0%,100%{transform:scale(.85)}50%{transform:scale(1)}}
.wave .arc{animation:w-arc .8s ease-in-out 2 both}
@keyframes w-arc{0%,100%{opacity:0}50%{opacity:.9}}
@media (prefers-reduced-motion: reduce) {
  svg * { animation-play-state: paused !important; animation-delay: 0s !important; }
}
