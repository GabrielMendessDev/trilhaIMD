.wave .torso{animation:w-torso 4s ease-in-out 2 both}
@keyframes w-torso{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
.wave .armR{animation:w-wave .8s ease-in-out 2 both}
@keyframes w-wave{0%,100%{transform:rotate(-130deg)}50%{transform:rotate(-170deg)}}
.wave .armL{animation:w-armL 2s ease-in-out 2 both}
