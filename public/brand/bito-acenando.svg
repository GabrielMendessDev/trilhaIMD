<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><style>
.wave .root{animation:w-root 2s ease-in-out 2 both}
@keyframes w-root{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}
.wave .shadow{animation:w-sh 2s ease-in-out 2 both}
