.doubt .tear{animation:d-sweat 2s ease-in 2 both}
@keyframes d-sweat{0%{opacity:0;transform:translateY(-4px)}20%{opacity:1;transform:translateY(0px)}100%{opacity:0;transform:translateY(34px)}}
@media (prefers-reduced-motion: reduce) {
  svg * { animation-play-state: paused !important; animation-delay: 0s !important; }
}
