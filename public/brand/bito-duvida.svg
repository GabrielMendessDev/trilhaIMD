.doubt .mouth{animation:d-mouth 4s ease-in-out 2 both}
@keyframes d-mouth{0%,100%{transform:translateX(0px) rotate(0deg)}25%,45%{transform:translateX(-7px) rotate(-8deg)}60%,80%{transform:translateX(7px) rotate(8deg)}}
.doubt .q{opacity:0;animation:d-q 4s ease-out 2 both}
