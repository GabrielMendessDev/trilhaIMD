.doubt .eye{animation:d-blink 4s ease-in-out 2 both}
@keyframes d-blink{0%,88%,100%{transform:scaleY(1)}91%{transform:scaleY(.08)}94%{transform:scaleY(1)}}
.doubt .browL{animation:d-bL 4s ease-in-out 2 both}
