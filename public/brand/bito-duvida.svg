<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><style>
.doubt .torso{animation:d-torso 4s ease-in-out 2 both}
@keyframes d-torso{0%,100%{transform:rotate(0deg) translateX(0px)}25%,50%{transform:rotate(-8deg) translateX(-4px)}75%{transform:rotate(5deg) translateX(3px)}}
.doubt .armR{animation:d-armR 4s ease-in-out 2 both}
@keyframes d-armR{0%{transform:rotate(-10deg)}18%{transform:rotate(-152deg)}24%{transform:rotate(-146deg)}30%{transform:rotate(-158deg)}36%{transform:rotate(-146deg)}42%{transform:rotate(-158deg)}48%{transform:rotate(-146deg)}54%{transform:rotate(-158deg)}60%{transform:rotate(-150deg)}78%,100%{transform:rotate(-10deg)}}
.doubt .armL{animation:d-armL 4s ease-in-out 2 both}
@keyframes d-armL{0%,100%{transform:rotate(10deg)}50%{transform:rotate(16deg)}}
.doubt .legR{animation:d-legR 4s ease-in-out 2 both}
