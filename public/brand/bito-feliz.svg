<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><style>
.happy .root{animation:h-jump 4s ease-in-out 2 both}
@keyframes h-jump{
0%,50%,100%{transform:translateY(0) scale(1.06,.93) rotate(0deg)}
10%,60%{transform:translateY(-6px) scale(.96,1.05) rotate(0deg)}
25%{transform:translateY(-48px) scale(.98,1.03) rotate(-3deg)}
75%{transform:translateY(-48px) scale(.98,1.03) rotate(3deg)}
40%,90%{transform:translateY(-6px) scale(1,1) rotate(0deg)}}
.happy .shadow{animation:h-sh 2s ease-in-out 2 both}
@keyframes h-sh{0%,100%{transform:scale(1.04)}50%{transform:scale(.72)}}
.happy .armR{animation:h-armR 2s ease-in-out 2 both}
@keyframes h-armR{0%,100%{transform:rotate(-158deg)}50%{transform:rotate(-138deg)}}
.happy .armL{animation:h-armL 2s ease-in-out 2 both}
@keyframes h-armL{0%,100%{transform:rotate(158deg)}50%{transform:rotate(138deg)}}
.happy .legL{animation:h-legL 2s ease-in-out 2 both}
@keyframes h-legL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(14deg)}}
.happy .legR{animation:h-legR 2s ease-in-out 2 both}
@keyframes h-legR{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-14deg)}}
.happy .mouth{animation:h-mouth .5s ease-in-out 2 both}
@keyframes h-mouth{0%,100%{transform:scale(1.1,.95)}50%{transform:scale(1.22,1.2)}}
.happy .eye{animation:h-eye 1s ease-in-out 2 both}
@keyframes h-eye{0%,100%{transform:scale(1,1)}50%{transform:scale(1.08,.9)}}
.happy .blush{animation:h-bl 1s ease-in-out 2 both}
@keyframes h-bl{0%,100%{opacity:.7}50%{opacity:1}}
.happy .pop{animation:h-pop 2s ease-out 2 both}
@keyframes h-pop{0%{opacity:0;transform:translateY(10px) scale(.2)}20%{opacity:1;transform:translateY(0) scale(1.1)}45%{opacity:1;transform:translateY(-10px) scale(1)}100%{opacity:0;transform:translateY(-44px) scale(.9)}}
@media (prefers-reduced-motion: reduce) {
  svg * { animation-play-state: paused !important; animation-delay: 0s !important; }
}
