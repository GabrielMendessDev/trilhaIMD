<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><style>
.sad .root{animation:s-root 4s ease-in-out 2 both}
@keyframes s-root{0%,100%{transform:translateY(6px) scale(1.01,.965)}50%{transform:translateY(6px) scale(.995,.99)}}
.sad .torso{animation:s-torso 4s ease-in-out 2 both}
@keyframes s-torso{0%,100%{transform:rotate(3deg) translateY(6px)}50%{transform:rotate(5deg) translateY(10px)}}
.sad .armR{animation:s-armR 4s ease-in-out 2 both}
@keyframes s-armR{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(2deg)}}
.sad .armL{animation:s-armL 4s ease-in-out 2 both}
@keyframes s-armL{0%,100%{transform:rotate(6deg)}50%{transform:rotate(1deg)}}
.sad .legL{transform:rotate(7deg)}
.sad .legR{transform:rotate(-7deg)}
.sad .eye{animation:s-eye 1s ease-in-out 2 both}
@keyframes s-eye{0%,100%{transform:translateY(0px) scale(1,1)}50%{transform:translateY(3px) scale(1.04,.88)}}
.sad .mouth{animation:s-mouth .5s ease-in-out 2 both}
@keyframes s-mouth{0%,100%{transform:scale(1,1)}50%{transform:scale(.95,1.15)}}
.sad .tear{opacity:0;animation:s-tear 2s ease-in 2 both}
@keyframes s-tear{0%{opacity:0;transform:translateY(0px) scale(.6)}15%{opacity:1;transform:translateY(4px) scale(1)}100%{opacity:0;transform:translateY(62px) scale(1)}}
@media (prefers-reduced-motion: reduce) {
  svg * { animation-play-state: paused !important; animation-delay: 0s !important; }
}
