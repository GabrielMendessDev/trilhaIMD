<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    /* ---------- Entrada (uma vez) ---------- */
    .node {
      transform-box: fill-box;
      transform-origin: center;
      animation: pop .7s cubic-bezier(.34, 1.56, .64, 1) both;
    }
    .n1 { animation-delay: .10s; }
    .n2 { animation-delay: .25s; }
    .n3 { animation-delay: .40s; }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

    .draw {
      stroke-dasharray: 1 2;
      animation: draw .9s cubic-bezier(.65, 0, .35, 1) both;
    }
    .d-left  { animation-delay: .60s; }
    .d-right { animation-delay: .75s; }
    .d-top   { animation-delay: .90s; animation-duration: .8s; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

    /* ---------- Idle (loop de 5s, começa depois da entrada) ---------- */
    .pulse {
      stroke-dasharray: .18 3;
      stroke-dashoffset: .22;
      animation: flow 5s cubic-bezier(.5, 0, .3, 1) 1.9s infinite both;
    }
    .p-top { animation-name: flow-top; }
    @keyframes flow     { 0% { stroke-dashoffset: .22; } 30% { stroke-dashoffset: -1; } 100% { stroke-dashoffset: -1; } }
    @keyframes flow-top { 0%, 52% { stroke-dashoffset: .22; } 80%, 100% { stroke-dashoffset: -1; } }

    .bump {
      transform-box: fill-box;
      transform-origin: center;
      animation: 5s ease-in-out 1.9s infinite both;
    }
    .k1 { animation-name: bump-purple; }
    .k2 { animation-name: bump-orange; }
    .k3 { animation-name: bump-teal; }
    @keyframes bump-purple { 0% { transform: scale(1); } 4% { transform: scale(1.08); } 12%, 52% { transform: scale(1); } 56% { transform: scale(1.08); } 64%, 100% { transform: scale(1); } }
    @keyframes bump-orange { 0% { transform: scale(1); } 4% { transform: scale(1.08); } 12%, 79% { transform: scale(1); } 83% { transform: scale(1.1); } 92%, 100% { transform: scale(1); } }
    @keyframes bump-teal   { 0%, 28% { transform: scale(1); } 31% { transform: scale(1.1); } 42%, 100% { transform: scale(1); } }

    .ring {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      animation: 5s ease-out 1.9s infinite both;
    }
    .g2 { animation-name: ring-orange; }
    .g3 { animation-name: ring-teal; }
    @keyframes ring-teal   { 0%, 28% { opacity: 0; transform: scale(1); } 29% { opacity: .9; transform: scale(1); } 50%, 100% { opacity: 0; transform: scale(2); } }
    @keyframes ring-orange { 0%, 78% { opacity: 0; transform: scale(1); } 79% { opacity: .9; transform: scale(1); } 98%, 100% { opacity: 0; transform: scale(2); } }
  </style>

  <!-- Linhas -->
  <g stroke="#8C6DFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path class="draw d-top"   pathLength="1" d="M9 13c5-1 10-1 15-2l15-2"/>
    <path class="draw d-left"  pathLength="1" d="M9 13c0 5 2 8 7 8h2c1 0 2 1 2 2v8c0 5 1 8 4 9"/>
    <path class="draw d-right" pathLength="1" d="M39 9c0 6-2 10-8 10h-1c-2 0-3 1-3 3v10c0 5-1 7-3 8"/>
  </g>

  <!-- Pulsos de luz percorrendo as linhas -->
  <g stroke="#fff" stroke-opacity=".9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path class="pulse p-top"   pathLength="1" d="M9 13c5-1 10-1 15-2l15-2"/>
    <path class="pulse p-left"  pathLength="1" d="M9 13c0 5 2 8 7 8h2c1 0 2 1 2 2v8c0 5 1 8 4 9"/>
    <path class="pulse p-right" pathLength="1" d="M39 9c0 6-2 10-8 10h-1c-2 0-3 1-3 3v10c0 5-1 7-3 8"/>
  </g>

  <!-- Nós -->
  <g class="node n1">
    <g class="bump k1">
      <circle cx="9" cy="13" r="8" fill="#6558F5"/>
      <circle cx="9" cy="13" r="3.5" fill="#fff"/>
    </g>
  </g>
  <g class="node n2">
    <g class="bump k2">
      <circle cx="39" cy="9" r="8" fill="#FFAA6B"/>
      <circle cx="39" cy="9" r="3.5" fill="#fff"/>
    </g>
    <circle class="ring g2" cx="39" cy="9" r="3.5" stroke="#fff" stroke-width="1.2"/>
  </g>
  <g class="node n3">
    <g class="bump k3">
      <circle cx="24" cy="39" r="8" fill="#25C5AB"/>
      <circle cx="24" cy="39" r="3.5" fill="#fff"/>
    </g>
    <circle class="ring g3" cx="24" cy="39" r="3.5" stroke="#fff" stroke-width="1.2"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
